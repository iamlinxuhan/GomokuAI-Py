name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  #  测试 — 每次 push / PR 都跑
  #
  #  放在这里而不是塞进下面三个打包 job：它们只在打 tag 时触发，而
  #  "改坏了但还没发版"恰恰是回归最该被挡住的时候。两条 Qt 用例只
  #  import 不构造 QApplication，因此无需 display 即可跑完。
  # ============================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Windows 打包用的版本（见下方 build-windows）；3.13 = 开发环境
        # 实际在跑的版本。刻意不测 3.12 —— 两个端点覆盖"发出去的"与"开发的"，
        # 中间那个既不发布也不开发。
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyQt5 pytest

      - name: Run test suite
        # -m "not perf"：跳过依赖机器速度的门槛（吞吐 nps / 到达深度）。
        # 那些门槛在开发机上是有效哨兵，在更慢的 runner 上只会变成随机红。
        # 正确性、增量一致性、时间合规、题库、VCF、棋型这些**全部保留**。
        run: python -m pytest -q -m "not perf"

  # ============================================================
  #  Windows 统一版 — 7z 压缩包 + install.bat
  #  纯 CPU：引擎不再依赖 PyTorch（GPU 分支在原版中从未生效，已整体删除）。
  #  连带收益是包体积——旧版为了塞 CUDA 运行时，要先清磁盘、再拆成两个包
  #  才不超 GitHub 的 2GB 上限；现在只剩 numpy + PyQt5，一个包绰绰有余。
  # ============================================================
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyQt5 pyinstaller

      - name: Build (onedir)
        run: |
          pyinstaller --onedir --windowed --icon="五子棋.ico" --name "GomokuAI" `
            main.py

      - name: Create 7z package with install.bat
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}' -replace '^v',''
          $pkgName = "GomokuAI_For_Windows_v${ver}"
          $appDir = "dist\GomokuAI"
          $pkgDir = $pkgName
          $outName = "${pkgName}.7z"

          # 创建打包目录结构
          mkdir $pkgDir
          Copy-Item -Recurse "$appDir\*" "$pkgDir\GomokuAI\"

          # install.bat
          @"
          @echo off
          chcp 65001 >nul
          echo ============================================
          echo   五子棋AI 安装程序
          echo   纯 CPU 运行，无需显卡驱动
          echo ============================================
          echo.
          set "INSTALL_DIR=%LOCALAPPDATA%\GomokuAI"
          echo 安装目录: %INSTALL_DIR%
          echo.
          if exist "%INSTALL_DIR%" (
              echo 检测到已有安装，正在覆盖...
              taskkill /f /im GomokuAI.exe >nul 2>&1
          )
          xcopy /E /I /Y "%~dp0GomokuAI" "%INSTALL_DIR%" >nul
          if %errorlevel% neq 0 (
              echo 安装失败！请以管理员身份运行。
              pause
              exit /b 1
          )
          echo.
          echo 创建快捷方式...
          powershell -ExecutionPolicy Bypass -Command "$ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut([Environment]::GetFolderPath('Desktop') + '\五子棋AI.lnk'); $sc.TargetPath = '%INSTALL_DIR%\GomokuAI.exe'; $sc.WorkingDirectory = '%INSTALL_DIR%'; $sc.IconLocation = '%INSTALL_DIR%\GomokuAI.exe,0'; $sc.Save(); $sp = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\五子棋AI'; New-Item -ItemType Directory -Force -Path $sp | Out-Null; $sc2 = $ws.CreateShortcut((Join-Path $sp '五子棋AI.lnk')); $sc2.TargetPath = '%INSTALL_DIR%\GomokuAI.exe'; $sc2.WorkingDirectory = '%INSTALL_DIR%'; $sc2.Save()"
          echo.
          echo ============================================
          echo   安装完成！
          echo   桌面快捷方式: 五子棋AI
          echo ============================================
          pause
          "@ | Set-Content -Encoding UTF8 "$pkgDir\install.bat"

          # uninstall.bat
          @"
          @echo off
          chcp 65001 >nul
          echo ============================================
          echo   卸载 五子棋AI
          echo ============================================
          echo.
          taskkill /f /im GomokuAI.exe >nul 2>&1
          del /q "%USERPROFILE%\Desktop\五子棋AI.lnk" >nul 2>&1
          rmdir /s /q "%APPDATA%\Microsoft\Windows\Start Menu\Programs\五子棋AI" >nul 2>&1
          rmdir /s /q "%LOCALAPPDATA%\GomokuAI" >nul 2>&1
          echo 卸载完成！
          pause
          "@ | Set-Content -Encoding UTF8 "$pkgDir\uninstall.bat"

          # 用 7z 压缩 (mx9 最高压缩率)
          & "C:\Program Files\7-Zip\7z.exe" a -mx9 "$outName" "$pkgDir\"
          Get-ChildItem "$outName" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GomokuAI_For_Windows
          path: GomokuAI_For_Windows_v*.7z


  # ============================================================
  #  Linux AMD64 统一 .deb — onedir → /opt/
  #  纯 CPU：不再需要 pytorch/pytorch 那个预装 CUDA 的镜像，
  #  换回普通 runner —— 镜像本身就有 ~7GB，而它提供的东西（CUDA 运行时）
  #  现在一件都用不上。顺带省掉了"清磁盘"那一步。
  # ============================================================
  build-linux-amd:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-venv binutils libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libegl1 libfontconfig1 libdbus-1-3

      - name: Setup venv & install pip deps
        # runner 的 python3 是 24.04 的系统解释器，受 PEP 668 保护，直接
        # pip install 会以 externally-managed-environment 退出。用 venv 隔离，
        # 与 ARM job 的做法一致。
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy PyQt5 pyinstaller

      - name: Build (onedir)
        run: |
          .venv/bin/pyinstaller --onedir --windowed --name "gomoku-ai" main.py

      - name: Package .deb
        shell: bash
        run: |
          raw="${GITHUB_REF_NAME}"
          if [[ "$raw" =~ ^v[0-9] ]]; then VERSION="${raw#v}"
          elif [[ "$raw" =~ ^[0-9] ]]; then VERSION="$raw"
          else VERSION="0.0.0-$(date -u +%Y%m%d-%H%M%S)"; fi
          echo "VERSION=$VERSION"

          PKG_DIR="deb_build"
          APP_DIR="${PKG_DIR}/opt/gomoku-ai"
          BIN_DIR="${PKG_DIR}/usr/local/bin"
          DESK_DIR="${PKG_DIR}/usr/share/applications"
          mkdir -p "${APP_DIR}" "${BIN_DIR}" "${DESK_DIR}" "${PKG_DIR}/DEBIAN"

          cp -r dist/gomoku-ai/* "${APP_DIR}/"
          chmod -R 755 "${APP_DIR}"

          # 启动脚本
          printf '%s\n%s\n' '#!/bin/bash' 'exec /opt/gomoku-ai/gomoku-ai "$@"' > "${BIN_DIR}/gomoku-ai"
          chmod 755 "${BIN_DIR}/gomoku-ai"

          # .desktop 文件
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            '[Desktop Entry]' \
            'Name=五子棋AI' \
            'Name[zh_CN]=五子棋AI' \
            'Comment=Gomoku AI - Negamax/PVS + Transposition Table + Quiescence & VCF (CPU)' \
            'Exec=/usr/local/bin/gomoku-ai' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Game;BoardGame;' \
            > "${DESK_DIR}/gomoku-ai.desktop"

          # DEBIAN/control
          # 界面全靠中文，而这几个基础库一个字体都不带 —— 最小系统上装完
          # 全是方框。用 `|` 串出候选链，任意一个 CJK 字体已存在即满足，
          # 不必为了一个棋盘拖 60MB 的 Noto CJK 下来。
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "Package: gomoku-ai" \
            "Version: ${VERSION}" \
            "Section: games" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: iamlinxuhan" \
            "Depends: libc6 (>= 2.28), libgl1, libglib2.0-0, libxkbcommon0, fonts-noto-cjk | fonts-wqy-microhei | fonts-wqy-zenhei | fonts-arphic-uming" \
            "Description: 五子棋AI - 位棋盘增量评估 + Negamax/PVS + 置换表 + 静止搜索/VCF 连续冲四 (纯 CPU)" \
            > "${PKG_DIR}/DEBIAN/control"

          # 打包前再清理一次，确保有足够空间
          df -h /
          pip cache purge 2>/dev/null || true
          rm -rf /tmp/pip-* /tmp/tmp* 2>/dev/null || true
          df -h /

          # 使用 gzip 压缩（比 zstd 省磁盘，兼容性更好）
          dpkg-deb -Zgzip --build "${PKG_DIR}" "GomokuAI_For_Linux_AMD.deb"
          ls -lh "GomokuAI_For_Linux_AMD.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GomokuAI_For_Linux_AMD
          path: GomokuAI_For_Linux_AMD.deb


  # ============================================================
  #  Linux ARM64 统一 .pkg — apt PyQt5 (跳过源码编译)
  # ============================================================
  build-linux-arm:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (含 apt PyQt5 跳过慢速源码编译)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-venv python3-dev python3-pyqt5 \
            binutils libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libegl1 libfontconfig1 libdbus-1-3 \
            qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools

      - name: Setup venv & install pip deps
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy
          .venv/bin/pip install pyinstaller
          .venv/bin/python -c "from PyQt5.QtWidgets import QApplication; print('PyQt5 OK')"

      - name: Build (onedir)
        run: |
          .venv/bin/pyinstaller --onedir --windowed --name "gomoku-ai-arm" main.py

      - name: Package .pkg
        run: |
          PKG_NAME="GomokuAI_For_Linux_ARM"
          PKG_DIR="${PKG_NAME}/gomoku-ai-arm"
          mkdir -p "${PKG_DIR}"
          cp -r dist/gomoku-ai-arm/* "${PKG_DIR}/"
          chmod -R 755 "${PKG_DIR}"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            '#!/bin/bash' \
            '# 五子棋AI ARM64 版安装脚本' \
            'set -e' \
            'APP_DIR="/opt/gomoku-ai-arm"' \
            'echo "Installing GomokuAI (ARM)..."' \
            'sudo mkdir -p "${APP_DIR}"' \
            'sudo cp -r gomoku-ai-arm/* "${APP_DIR}/"' \
            'sudo chmod -R 755 "${APP_DIR}"' \
            'sudo ln -sf "${APP_DIR}/gomoku-ai-arm" /usr/local/bin/gomoku-ai' \
            'echo "Done! Run: gomoku-ai"' \
            > "${PKG_NAME}/install.sh"
          chmod 755 "${PKG_NAME}/install.sh"
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          mv "${PKG_NAME}.tar.gz" "${PKG_NAME}.pkg"
          ls -lh "${PKG_NAME}.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GomokuAI_For_Linux_ARM
          path: GomokuAI_For_Linux_ARM.pkg


  # ============================================================
  #  GitHub Release (仅 tag 推送时触发)
  # ============================================================
  release:
    # `test` 必须在这里 —— 否则测试挂了照样能发版（三个 build job 都不依赖它，
    # 而 `softprops/action-gh-release` 也不看测试结果）。CI 跑的是
    # `-m "not perf"`，所以这条闸门不受 runner 快慢影响。
    needs:
      - test
      - build-windows
      - build-linux-amd
      - build-linux-arm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: List release files
        run: ls -lah release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ github.ref_name }}"
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
